# Generates ios/Loop.xcodeproj. Run `xcodegen` in ios/ after changing this file or adding files.
name: Loop
options:
  bundleIdPrefix: com.jaredgrossi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  MapboxMaps:
    url: https://github.com/mapbox/mapbox-maps-ios.git
    exactVersion: 11.34.2
targets:
  Loop:
    type: application
    platform: iOS
    sources:
      - path: Loop
        excludes:
          - "**/*-OFL.txt"
      - path: Loop/Resources/Fonts
        includes:
          - "*-OFL.txt"
        buildPhase: resources
      - path: Fixtures
        buildPhase: resources
    dependencies:
      - package: MapboxMaps
    info:
      path: Loop/Info.plist
      properties:
        CFBundleDisplayName: Loop
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        MBXAccessToken: $(MAPBOX_ACCESS_TOKEN)
        LoopAPIBase: $(LOOP_API_BASE)
        NSLocationWhenInUseUsageDescription: Loop starts your run from where you are.
        UIAppFonts:
          - Fraunces.ttf
          - InstrumentSans.ttf
        UILaunchScreen:
          UIColorName: LaunchBackground   # map-land, Paper and Night
          UIImageName: LaunchMark         # the route L, where the in-app logo draws it
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LOOP_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon   # Resources/Assets.xcassets: light, dark, tinted (1024 single size)
  LoopTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LoopTests
    dependencies:
      - target: Loop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LOOP_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  LoopUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LoopUITests
    dependencies:
      - target: Loop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LOOP_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Loop
schemes:
  Loop:
    build:
      targets:
        Loop: all
        LoopTests: [test]
        LoopUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LoopTests
        - LoopUITests
  # Device performance runs (UI tests only, so Release builds without the @testable unit tests).
  LoopPerf:
    build:
      targets:
        Loop: all
        LoopUITests: [test]
    test:
      targets:
        - LoopUITests
