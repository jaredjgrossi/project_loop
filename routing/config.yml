# GraphHopper 11.1: foot routing on the NYC extract.
# Round-trip routes only work without contraction hierarchies, so profiles_ch is empty.
graphhopper:
  custom_models.directory: /config/custom_models
  datareader.file: /data/nyc.osm.pbf
  graph.location: /graph-cache/foot-v4 # to force a re-import, delete routing/graph-cache/foot-v4 (or bump the suffix)
  # Elevation (decision 014): public Terrain Tiles on AWS (Skadi format; USGS elevation data in the US), downloaded on
  # import into the cache. Routes return [lon, lat, elevation] when a request asks for elevation.
  graph.elevation.provider: skadi
  graph.elevation.cache_dir: /graph-cache/elevation
  profiles:
    - name: foot
      custom_model_files: [loop_foot.json]
  profiles_ch: []
  profiles_lm: []
  # crossing: OSM crosswalk type (traffic_signals, marked, ...) per edge, for the signal penalty of runners who wait
  # at lights (decision 015).
  graph.encoded_values: foot_access, foot_priority, foot_average_speed, foot_road_access, hike_rating, mtb_rating, country, road_class, road_environment, crossing
  import.osm.ignored_highways: "" # required key; keep every highway type, the foot model already excludes the unwalkable ones
  prepare.min_network_size: 200
  prepare.subnetworks.threads: 1
  routing.snap_preventions_default: tunnel, bridge, ferry # don't start a run on a bridge deck
  routing.non_ch.max_waypoint_distance: 1000000
  graph.dataaccess.default_type: RAM_STORE

server:
  application_connectors:
    - type: http
      port: 8989
      bind_host: 0.0.0.0 # inside the container; compose publishes it on localhost only
      max_request_header_size: 50k
  request_log:
    appenders: []
  admin_connectors:
    - type: http
      port: 8990
      bind_host: 0.0.0.0

logging:
  appenders:
    - type: console
      time_zone: UTC
      log_format: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
