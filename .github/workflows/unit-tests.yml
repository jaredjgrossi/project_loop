# Unit tests on every push and pull request (decision 019). The evals need the live stack (Postgres + PostGIS,
# GraphHopper and the loaded NYC data) and are not run here.
name: unit tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Nothing listens on these: a unit test that reaches for a service fails instead of passing on a laptop.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:9/none
      GRAPHHOPPER_URL: http://127.0.0.1:9
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run --frozen pytest -p ci.no_network
