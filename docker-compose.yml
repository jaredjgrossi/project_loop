services:
  db:
    # Community ARM build of PostGIS: the official postgis/postgis image is Intel-only.
    image: imresamu/postgis:16-3.5-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loop}
      POSTGRES_DB: ${POSTGRES_DB:-loop}
    ports:
      - "127.0.0.1:5432:5432" # localhost only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loop} -d ${POSTGRES_DB:-loop}"]
      interval: 5s
      timeout: 3s
      retries: 10

  graphhopper:
    build: ./routing
    ports:
      - "127.0.0.1:8989:8989" # localhost only
    volumes:
      - ./routing/config.yml:/config/config.yml:ro
      - ./routing/custom_models:/config/custom_models:ro
      - ./routing/data:/data:ro # nyc.osm.pbf, built by `python -m routing.prepare_osm`
      - ./routing/graph-cache:/graph-cache
    healthcheck:
      # The first start imports the map (a few minutes); /health only answers once that is done.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8989 && printf \"GET /health HTTP/1.0\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -q 200'"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

volumes:
  pgdata:
