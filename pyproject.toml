[project]
name = "loop"
version = "0.1.0"
description = "Loop: NYC run builder"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["api", "etl"]
pythonpath = ["."]
