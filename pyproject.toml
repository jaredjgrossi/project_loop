[project]
name = "loop"
version = "0.1.0"
description = "Loop: NYC run builder"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pyproj>=3.8.0",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["api", "etl", "routing"]
pythonpath = ["."]
